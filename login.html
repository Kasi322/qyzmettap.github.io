<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кіру — QyzmetTap</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-light: #f4f6f9;
            --text-dark: #333;
            --error-color: #dc3545;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            display: inline-block;
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #666;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box; /* Важный момент для верстки */
        }
        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #004494;
        }
        .links {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .links a {
            color: var(--primary-color);
            text-decoration: none;
        }
        /* Стиль для ошибки */
        .error-message {
            color: var(--error-color);
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none; /* Скрыто по умолчанию */
            font-size: 0.9rem;
        }
        /* Анимация ошибки */
        .shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-shield-halved"></i> QyzmetTap
        </a>
        <h2>Жүйеге кіру</h2>
        
        <div id="error-msg" class="error-message"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email немесе ЖСН</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Құпия сөз</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="btn-primary">Кіру</button>
        </form>

        <div class="links">
            <p>Аккаунтыңыз жоқ па? <a href="register.html">Тіркелу</a></p>
            <p><a href="#">Құпия сөзді ұмыттыңыз ба?</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
