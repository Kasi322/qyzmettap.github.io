<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу — QyzmetTap</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-light: #f4f6f9;
            --text-dark: #333;
            --error-color: #dc3545;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px; /* Сәл кеңірек */
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #666;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #004494;
        }
        .links {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .links a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .error-message {
            color: var(--error-color);
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-shield-halved"></i> QyzmetTap
        </a>
        <h2>Тіркелу</h2>

        <div id="error-msg" class="error-message"></div>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Аты-жөні</label>
                <input type="text" id="fullname" placeholder="Асқар Асқаров" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.kz" required>
            </div>

            <div class="form-group">
                <label>Пайдаланушы рөлі</label>
                <select id="role" required>
                    <option value="" disabled selected>Рөлді таңдаңыз...</option>
                    <option value="seeker">Жұмыс іздеуші</option>
                    <option value="employer">Жұмыс беруші</option>
                    <option value="monitor">Бақылау органы (Антикор)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Құпия сөз</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <div class="form-group">
                <label>Құпия сөзді растау</label>
                <input type="password" id="confirm-password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">Тіркелу</button>
        </form>

        <div class="links">
            <p>Аккаунтыңыз бар ма? <a href="login.html">Кіру</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
